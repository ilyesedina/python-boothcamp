<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Bootcamp Playground</title>
  <link rel="stylesheet" href="web/style.css">
  <script type="module" src="web/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">py</span>
      <div>
        <h1>Python Bootcamp</h1>
        <p>Each day's project, running live in your browser</p>
      </div>
    </div>
    <span id="status" class="status" data-state="loading">Loading Python…</span>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Days">
      <ol id="day-list"></ol>
    </nav>

    <main class="main">
      <section class="project-head">
        <p id="project-day" class="eyebrow"></p>
        <h2 id="project-title"></h2>
        <p id="project-path" class="path"></p>
      </section>

      <section class="console" aria-label="Program console">
        <div class="console-bar">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span id="console-name" class="console-name"></span>
          <div class="actions">
            <button id="clear-btn" class="btn ghost" type="button">Clear</button>
            <button id="stop-btn" class="btn danger" type="button" disabled>Stop</button>
            <button id="run-btn" class="btn primary" type="button" disabled>▶ Run</button>
          </div>
        </div>
        <pre id="terminal" class="terminal" tabindex="0" aria-live="polite"></pre>
        <form id="input-form" class="stdin" autocomplete="off">
          <span class="prompt" aria-hidden="true">›</span>
          <input id="stdin" type="text" spellcheck="false" aria-label="Program input"
                 placeholder="Press Run, then type your answers here" disabled>
          <button id="send-btn" class="btn primary" type="submit" disabled>Enter</button>
        </form>
      </section>

      <details id="source" class="source">
        <summary>View <span id="source-name">main.py</span></summary>
        <pre id="source-code"></pre>
      </details>
    </main>
  </div>

  <div id="banner" class="banner" role="alert" hidden></div>
  <script>
    // Runs even when the module script above can't load, so problems are explained.
    (function () {
      var banner = document.getElementById("banner");
      var status = document.getElementById("status");
      function fail(html) {
        banner.innerHTML = html;
        banner.hidden = false;
        status.dataset.state = "error";
        status.textContent = "Python unavailable";
      }
      if (location.protocol === "file:") {
        fail("This page was opened as a file, so the browser blocks it. In a terminal in the project folder run " +
             "<code>python web/serve.py</code>, then open <code>http://localhost:8000</code>.");
        return;
      }
      setTimeout(function () {
        if (!document.body.dataset.appStarted) {
          fail("The page script didn't start. Run <code>python web/serve.py</code> from the project folder, " +
               "open <code>http://localhost:8000</code>, and hard-refresh (Ctrl+Shift+R).");
        }
      }, 4000);
    })();
  </script>
</body>
</html>
